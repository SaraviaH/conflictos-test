<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="contacto.css">
</head>
<body>
  <main class="contacto">
    <h1>Contáctanos</h1>
    <p class="intro">¿Tienes alguna duda sobre nuestros productos o tu pedido? Escríbenos y te responderemos lo antes posible.</p>

    <section class="datos">
      <p><strong>Correo electrónico:</strong> contacto@mitienda.com</p>
      <p><strong>Teléfono:</strong> +51 999 888 777</p>
      <p><strong>Dirección:</strong> Av. Ejemplo 123, Lima, Perú</p>
    </section>

    <form action="#" method="post">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>

    <a class="volver" href="index.html">Volver a la página principal</a>
  </main>
</body>
</html>
