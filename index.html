
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .producto {
            background: white;
            width: 250px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 10px #ddd;
        }

        .producto img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        h3 {
            margin-bottom: 5px;
        }

        .precio {
            color: #198754;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }
    </style>
</head>

<body>

    <div class="producto">
        <img src="https://placehold.co/300x250?text=Producto"
             alt="Imagen del producto">

        <h3>Nombre del producto</h3>

        <p>Descripción breve del producto.</p>

        <p class="precio">S/ 59.90</p>

        <button onclick="alert('Producto agregado al carrito')">
            Agregar al carrito
        </button>
    </div>

</body>
</html>
