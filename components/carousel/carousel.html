<!-- Componente Reutilizable: Carrusel Principal -->
<section class="luxe-carousel" aria-roledescription="carousel" aria-label="Colecciones destacadas de Luxe Glow">
  <div class="luxe-carousel-viewport">
    <div class="luxe-carousel-track" id="luxe-carousel-track" aria-live="polite">
      <!-- Las diapositivas se inyectan dinámicamente desde data/carousel.json mediante js/components/carousel/carousel.js -->
    </div>

    <!-- Controles de navegación anterior / siguiente -->
    <button type="button" class="luxe-carousel-control luxe-carousel-prev" id="luxe-carousel-prev" aria-label="Diapositiva anterior">
      <i class="fas fa-chevron-left" aria-hidden="true"></i>
    </button>
    <button type="button" class="luxe-carousel-control luxe-carousel-next" id="luxe-carousel-next" aria-label="Siguiente diapositiva">
      <i class="fas fa-chevron-right" aria-hidden="true"></i>
    </button>

    <!-- Indicadores de posición -->
    <div class="luxe-carousel-indicators" id="luxe-carousel-indicators" role="tablist" aria-label="Seleccionar diapositiva">
      <!-- Indicadores generados dinámicamente -->
    </div>
  </div>
</section>
